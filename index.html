<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>跑步節奏動畫器</title>
<style>
:root{--bg:#0a0a14;--card:#13131f;--border:#2a2a3e;--accent:#6366f1;--purple:#a78bfa;--blue:#60a5fa;--text:#e2e8f0;--sub:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{text-align:center;padding:40px 20px 20px}
h1{font-size:clamp(1.5rem,3.5vw,2.3rem);background:linear-gradient(90deg,var(--purple),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--sub);margin-top:8px;font-size:.95rem}
.wrap{max-width:700px;margin:0 auto;padding:0 16px 40px}

/* Canvas stage */
.stage{position:relative;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:16px}
canvas{display:block;width:100%;height:auto}
.badge-row{position:absolute;bottom:12px;left:12px;display:flex;gap:8px;pointer-events:none}
.badge{background:rgba(10,10,20,0.72);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:.78rem;color:var(--sub)}
.badge span{color:var(--text);font-weight:700}

/* Controls card */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 24px;margin-bottom:16px}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ctrl-label{font-size:.9rem;color:var(--sub)}
.ctrl-val{font-size:1.05rem;font-weight:700;color:var(--text)}
.ctrl-sub{font-size:.78rem;color:var(--sub);margin-top:1px}
.rating{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:700;margin-left:8px}
.rating.green{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.rating.yellow{background:rgba(234,179,8,.15);color:#facc15;border:1px solid rgba(234,179,8,.3)}
.rating.red{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;outline:none;cursor:pointer;margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px rgba(99,102,241,.25),0 0 10px rgba(99,102,241,.5)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:none;box-shadow:0 0 0 3px rgba(99,102,241,.25),0 0 10px rgba(99,102,241,.5)}
.ctrl-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:12px}
.check-row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--sub);cursor:pointer;user-select:none}
.check-row input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 22px;font-size:.88rem;font-weight:700;cursor:pointer;transition:opacity .2s;letter-spacing:.02em}
.btn:hover{opacity:.85}
.btn.paused{background:#374151}

/* Metrics grid */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center}
.metric-val{font-size:1.15rem;font-weight:700;color:var(--purple);margin-bottom:4px}
.metric-lbl{font-size:.72rem;color:var(--sub)}

/* Tip */
.tip{border-radius:12px;padding:14px 18px;font-size:.84rem;line-height:1.6;color:var(--text);border:1px solid var(--border);margin-bottom:16px;border-left-width:4px}
.tip.green{background:rgba(34,197,94,.07);border-left-color:#22c55e}
.tip.yellow{background:rgba(234,179,8,.07);border-left-color:#eab308}
.tip.red{background:rgba(239,68,68,.07);border-left-color:#ef4444}
.tip strong{display:block;margin-bottom:3px}

footer{text-align:center;padding:20px;color:var(--sub);font-size:.78rem;border-top:1px solid var(--border)}

@media(max-width:480px){
  .metrics{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header>
  <h1>跑步節奏動畫器</h1>
  <p>調整速度與步頻，即時預覽跑步姿態動畫</p>
</header>

<div class="wrap">
  <!-- Stage -->
  <div class="stage">
    <canvas id="cv" width="600" height="340"></canvas>
    <div class="badge-row">
      <div class="badge">速度 <span id="bSpeed">12.0</span> km/h</div>
      <div class="badge">步頻 <span id="bCad">174</span> spm</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="card">
    <!-- Speed -->
    <div class="ctrl-row">
      <div>
        <div class="ctrl-label">跑步速度</div>
        <div class="ctrl-sub" id="paceDisplay">配速 5:00/km</div>
      </div>
      <div style="text-align:right">
        <div class="ctrl-val" id="speedDisplay">12.0 km/h</div>
      </div>
    </div>
    <input type="range" id="speedSlider" min="5" max="22" step="0.5" value="12"/>

    <div style="height:14px"></div>

    <!-- Cadence -->
    <div class="ctrl-row">
      <div>
        <div class="ctrl-label">跑步步頻</div>
      </div>
      <div style="text-align:right">
        <div class="ctrl-val" id="cadDisplay">174 spm <span class="rating green" id="cadRating">● 優秀</span></div>
      </div>
    </div>
    <input type="range" id="cadSlider" min="140" max="200" step="1" value="174"/>

    <div class="ctrl-footer">
      <label class="check-row">
        <input type="checkbox" id="autoLink"/> 速度自動連動步頻
      </label>
      <button class="btn" id="pauseBtn">⏸ 暫停</button>
    </div>
  </div>

  <!-- Metrics -->
  <div class="metrics">
    <div class="metric"><div class="metric-val" id="mPace">5:00</div><div class="metric-lbl">配速 /km</div></div>
    <div class="metric"><div class="metric-val" id="mStride">1.15m</div><div class="metric-lbl">步幅</div></div>
    <div class="metric"><div class="metric-val" id="mLean">8°</div><div class="metric-lbl">前傾角</div></div>
    <div class="metric"><div class="metric-val" id="mGCT">219ms</div><div class="metric-lbl">接地時間</div></div>
  </div>

  <!-- Tip -->
  <div class="tip" id="tipCard">
    <strong id="tipTitle">步頻優秀！</strong>
    <span id="tipBody">你的步頻在理想範圍，有助於減少衝擊力並提升跑步效率，繼續保持！</span>
  </div>
</div>

<footer>跑步節奏動畫器 &copy; 2026 &mdash; 以 Canvas 2D 即時渲染</footer>

<script>
// ── State ──
let speed = 12, cadence = 174, phase = 0, bgScroll = 0;
let paused = false, lastTs = null;

// ── Canvas ──
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 600, H = 340;
const GROUND_Y = 295, HIP_X = 290, HIP_Y_BASE = 212;
const TORSO = 56, HEAD_R = 14, THIGH = 43, SHIN = 39, UARM = 25, FARM = 21;

// Ambient dots (deterministic)
const DOTS = Array.from({length:20},(_,i)=>{
  const x = ((i*137+73)%580)+10;
  const y = ((i*89+31)%260)+10;
  const r = (i%3)*0.5+0.5;
  const op = 0.08+((i*53)%40)*0.003;
  return{x,y,r,op};
});

// ── Slider styling ──
function updateSliderTrack(el){
  const mn=+el.min, mx=+el.max, v=+el.value;
  const pct=((v-mn)/(mx-mn))*100;
  el.style.background=`linear-gradient(to right,#6366f1 ${pct}%,#2a2a3e ${pct}%)`;
}

// ── UI refs ──
const speedSlider=document.getElementById('speedSlider');
const cadSlider=document.getElementById('cadSlider');
const autoLink=document.getElementById('autoLink');
const pauseBtn=document.getElementById('pauseBtn');

function cadRatingInfo(c){
  if(c>=170) return{cls:'green',txt:'● 優秀'};
  if(c>=163) return{cls:'yellow',txt:'● 良好'};
  if(c>=155) return{cls:'yellow',txt:'● 普通'};
  return{cls:'red',txt:'● 偏低'};
}

function fmtPace(spd){
  const sec=3600/spd;
  const m=Math.floor(sec/60);
  const s=Math.round(sec%60);
  return m+':'+(s<10?'0':'')+s;
}

function updateUI(){
  // badge
  document.getElementById('bSpeed').textContent=speed.toFixed(1);
  document.getElementById('bCad').textContent=cadence;
  // slider displays
  document.getElementById('speedDisplay').textContent=speed.toFixed(1)+' km/h';
  document.getElementById('paceDisplay').textContent='配速 '+fmtPace(speed)+'/km';
  const ri=cadRatingInfo(cadence);
  document.getElementById('cadDisplay').innerHTML=cadence+' spm <span class="rating '+ri.cls+'" id="cadRating">'+ri.txt+'</span>';
  // metrics
  document.getElementById('mPace').textContent=fmtPace(speed);
  const stride=(speed/3.6/(cadence/60)).toFixed(2);
  document.getElementById('mStride').textContent=stride+'m';
  const leanDeg=(5+(speed-5)/17*6).toFixed(1);
  document.getElementById('mLean').textContent=leanDeg+'°';
  document.getElementById('mGCT').textContent=Math.round(38000/cadence)+'ms';
  // tip
  const tipCard=document.getElementById('tipCard');
  const tipTitle=document.getElementById('tipTitle');
  const tipBody=document.getElementById('tipBody');
  if(cadence>=175){
    tipCard.className='tip green';
    tipTitle.textContent='步頻優秀！';
    tipBody.textContent='你的步頻在理想範圍（175+ spm），有助於減少衝擊力、降低受傷風險並提升整體效率，繼續保持！';
  } else if(cadence>=163){
    tipCard.className='tip yellow';
    tipTitle.textContent='步頻良好，可再提升';
    tipBody.textContent='步頻接近理想範圍，嘗試再提高幾步，維持在 175 spm 以上能讓跑步更流暢省力。';
  } else {
    tipCard.className='tip red';
    tipTitle.textContent='步頻偏低，建議調整';
    tipBody.textContent='步頻低於 163 spm 可能增加衝擊力與受傷風險。建議使用節拍器輔助訓練，逐步提升至 170+ spm。';
  }
  // slider tracks
  updateSliderTrack(speedSlider);
  updateSliderTrack(cadSlider);
}

speedSlider.addEventListener('input',()=>{
  speed=+speedSlider.value;
  if(autoLink.checked) cadence=Math.round(155+speed*1.55), cadSlider.value=cadence;
  updateUI();
});

cadSlider.addEventListener('input',()=>{
  cadence=+cadSlider.value;
  updateUI();
});

autoLink.addEventListener('change',()=>{
  if(autoLink.checked){ cadence=Math.round(155+speed*1.55); cadSlider.value=cadence; updateUI(); }
});

pauseBtn.addEventListener('click',togglePause);
cv.addEventListener('click',togglePause);

function togglePause(){
  paused=!paused;
  pauseBtn.textContent=paused?'▶ 繼續':'⏸ 暫停';
  pauseBtn.className=paused?'btn paused':'btn';
  if(!paused) lastTs=null;
}

// ── Drawing helpers ──
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function circle(x,y,r,fill,stroke,sw){
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw||1;ctx.stroke();}
}

function drawLimb(x1,y1,x2,y2,color,lw,glow){
  ctx.save();
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';
  if(glow){ctx.shadowColor=glow;ctx.shadowBlur=10;}
  line(x1,y1,x2,y2);
  ctx.restore();
}

function drawFoot(ax,ay,sh,color,glow){
  const fx=ax+12*Math.cos(sh), fy=ay-12*Math.sin(sh);
  ctx.save();
  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.lineCap='round';
  if(glow){ctx.shadowColor=glow;ctx.shadowBlur=8;}
  line(ax,ay,fx,fy);
  ctx.restore();
}

// ── Draw frame ──
function drawFrame(){
  const leanDeg=5+(speed-5)/17*6;
  const lean=leanDeg*Math.PI/180;
  const thighAmp=0.62, kneeBendMax=1.22, armAmp=0.50;
  const bounce=5*Math.abs(Math.sin(phase));
  const hy=HIP_Y_BASE+bounce, hx=HIP_X;

  // Shoulder
  const sx=hx-TORSO*Math.sin(lean), sy=hy-TORSO*Math.cos(lean);
  // Head
  const hdx=sx-(HEAD_R+2)*Math.sin(lean), hdy=sy-(HEAD_R+2)*Math.cos(lean);

  // Legs
  const rTh=thighAmp*Math.cos(phase);
  const lTh=-thighAmp*Math.cos(phase);
  const rKB=kneeBendMax*Math.max(0,-Math.sin(phase));
  const lKB=kneeBendMax*Math.max(0,Math.sin(phase));

  const rKx=hx+THIGH*Math.sin(rTh), rKy=hy+THIGH*Math.cos(rTh);
  const rSh=rTh-rKB;
  const rAx=rKx+SHIN*Math.sin(rSh), rAy=rKy+SHIN*Math.cos(rSh);

  const lKx=hx+THIGH*Math.sin(lTh), lKy=hy+THIGH*Math.cos(lTh);
  const lSh=lTh-lKB;
  const lAx=lKx+SHIN*Math.sin(lSh), lAy=lKy+SHIN*Math.cos(lSh);

  // Arms
  const rArmA=lean-armAmp*Math.cos(phase);
  const lArmA=lean+armAmp*Math.cos(phase);
  const rEx=sx+UARM*Math.sin(rArmA), rEy=sy+UARM*Math.cos(rArmA);
  const rHx=rEx+FARM*Math.sin(rArmA+Math.PI/2), rHy=rEy+FARM*Math.cos(rArmA+Math.PI/2);
  const lEx=sx+UARM*Math.sin(lArmA), lEy=sy+UARM*Math.cos(lArmA);
  const lHx=lEx+FARM*Math.sin(lArmA+Math.PI/2), lHy=lEy+FARM*Math.cos(lArmA+Math.PI/2);

  const rightFront=Math.cos(phase)>0;

  // helpers
  function drawRightLimbs(front){
    const lw=front?3:2;
    const col=front?'#c4b5fd':'rgba(139,92,246,0.4)';
    const glow=front?'#8b5cf6':null;
    drawLimb(hx,hy,rKx,rKy,col,lw,glow);
    drawLimb(rKx,rKy,rAx,rAy,col,lw,glow);
    drawFoot(rAx,rAy,rSh,col,glow);
    drawLimb(sx,sy,rEx,rEy,col,lw,glow);
    drawLimb(rEx,rEy,rHx,rHy,col,lw,glow);
  }
  function drawLeftLimbs(front){
    const lw=front?3:2;
    const col=front?'#93c5fd':'rgba(96,165,250,0.4)';
    const glow=front?'#60a5fa':null;
    drawLimb(hx,hy,lKx,lKy,col,lw,glow);
    drawLimb(lKx,lKy,lAx,lAy,col,lw,glow);
    drawFoot(lAx,lAy,lSh,col,glow);
    drawLimb(sx,sy,lEx,lEy,col,lw,glow);
    drawLimb(lEx,lEy,lHx,lHy,col,lw,glow);
  }
  function drawBody(){
    // Torso
    ctx.save();
    ctx.strokeStyle='#e2e8f0';ctx.lineWidth=3.5;ctx.lineCap='round';
    ctx.shadowColor='#818cf8';ctx.shadowBlur=15;
    line(hx,hy,sx,sy);
    ctx.restore();
    // Head
    ctx.save();
    ctx.shadowColor='#818cf8';ctx.shadowBlur=10;
    circle(hdx,hdy,HEAD_R,'#0a0a18','#e2e8f0',2.5);
    ctx.restore();
    // Eye
    const eyeX=hdx+(HEAD_R-4)*Math.sin(lean+0.1);
    const eyeY=hdy-(HEAD_R-4)*Math.cos(lean+0.1)+2;
    circle(eyeX,eyeY,2.5,'#c4b5fd');
  }

  if(rightFront){
    drawLeftLimbs(false);
    drawBody();
    drawRightLimbs(true);
  } else {
    drawRightLimbs(false);
    drawBody();
    drawLeftLimbs(true);
  }
}

// ── Draw background ──
function drawBg(){
  // Sky gradient
  const sky=ctx.createLinearGradient(0,0,0,GROUND_Y);
  sky.addColorStop(0,'#07071a');
  sky.addColorStop(1,'#0f0f24');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GROUND_Y);

  // Horizon glow
  ctx.save();
  const hGlow=ctx.createLinearGradient(0,GROUND_Y-60,0,GROUND_Y);
  hGlow.addColorStop(0,'rgba(99,102,241,0)');
  hGlow.addColorStop(1,'rgba(99,102,241,0.08)');
  ctx.fillStyle=hGlow;ctx.fillRect(0,GROUND_Y-60,W,60);
  ctx.restore();

  // Ground band
  const grd=ctx.createLinearGradient(0,GROUND_Y,0,H);
  grd.addColorStop(0,'#0d0d22');
  grd.addColorStop(1,'#08080f');
  ctx.fillStyle=grd;ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);

  // Ground line
  ctx.strokeStyle='rgba(99,102,241,0.35)';ctx.lineWidth=1.5;
  line(0,GROUND_Y,W,GROUND_Y);

  // Lane dashes
  const dashW=48, period=128;
  const offset=bgScroll%period;
  ctx.strokeStyle='rgba(99,102,241,0.18)';ctx.lineWidth=2;ctx.lineCap='butt';
  for(let x=-period+offset;x<W+period;x+=period){
    const sx=x, ex=sx+dashW;
    ctx.beginPath();ctx.moveTo(sx,GROUND_Y+8);ctx.lineTo(ex,GROUND_Y+8);ctx.stroke();
  }

  // Motion lines (speed > 9)
  if(speed>9){
    const op=Math.min(1,(speed-9)/10)*0.5;
    ctx.save();
    for(let i=0;i<5;i++){
      const y=GROUND_Y-60-i*28;
      const len=20+i*12;
      const x=HIP_X-65-i*8;
      ctx.strokeStyle=`rgba(99,102,241,${op*(0.4+i*0.1)})`;ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-len,y);ctx.stroke();
    }
    ctx.restore();
  }

  // Ambient dots
  ctx.save();
  for(const d of DOTS){
    ctx.globalAlpha=d.op;
    circle(d.x,d.y,d.r,'#a78bfa');
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

// ── Beat indicator ──
function drawBeat(){
  const beatPulse=phase%(Math.PI);
  const bx=558, by=28;
  if(beatPulse<0.4){
    const t=1-beatPulse/0.4;
    ctx.save();
    ctx.globalAlpha=t;
    ctx.fillStyle=`rgba(167,139,250,${t})`;
    ctx.beginPath();ctx.arc(bx,by,8+(1-t)*5,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    ctx.restore();
  }
  // Ring
  ctx.save();
  ctx.strokeStyle='rgba(99,102,241,0.4)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(bx,by,10,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

// ── Pause overlay ──
function drawPauseOverlay(){
  ctx.save();
  ctx.fillStyle='rgba(10,10,20,0.55)';ctx.fillRect(0,0,W,H);
  ctx.font='bold 22px "Segoe UI",sans-serif';
  ctx.fillStyle='rgba(226,232,240,0.9)';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('⏸ 已暫停',W/2,H/2);
  ctx.restore();
}

// ── Animation loop ──
function tick(ts){
  if(!paused){
    if(lastTs===null) lastTs=ts;
    const dt=Math.min((ts-lastTs)/1000,0.05);
    lastTs=ts;
    phase+=2*Math.PI*(cadence/120)*dt;
    bgScroll+=speed*18*dt;
  }

  ctx.clearRect(0,0,W,H);
  drawBg();
  drawFrame();
  drawBeat();
  if(paused) drawPauseOverlay();

  requestAnimationFrame(tick);
}

// ── Init ──
updateUI();
requestAnimationFrame(tick);
</script>
</body>
</html>
